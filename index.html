<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Collage</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== 起動画面(未使用・将来のために保持): 枚数 & キャンバスサイズ選択 ===== -->
<div id="startScreen" class="screen" hidden>
  <div class="start-card">
    <h1>Collage</h1>
    <p class="sub">写真の枚数とキャンバスサイズを選んで開始</p>

    <div class="field">
      <label>写真の枚数</label>
      <div id="countPicker" class="chip-row"></div>
    </div>

    <div class="field">
      <label>キャンバスサイズ</label>
      <div id="ratioPicker" class="chip-row"></div>
    </div>

    <button id="startBtn" class="primary-btn">作成をはじめる</button>
    <button id="resumeBtn" class="ghost-btn" hidden>前回の続きから再開する</button>
  </div>
</div>

<!-- ===== エディタ画面(起動時にそのまま表示) ===== -->
<div id="editorScreen" class="screen">

  <header class="topbar">
    <button id="undoBtn" class="round-icon-btn" title="元に戻す">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M7 8H4V5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4.5 15.5A8 8 0 1 0 6 6.3L4 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button id="redoBtn" class="round-icon-btn" title="やり直す">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M17 8H20V5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M19.5 15.5A8 8 0 1 1 18 6.3L20 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="topbar-spacer"></div>
    <button id="templateBtn" class="text-icon-btn" title="テンプレート">テンプレート</button>
    <button id="exportBtn" class="primary-btn small">書き出す</button>
  </header>

  <main class="editor-main">
    <div class="canvas-wrap">
      <canvas id="mainCanvas"></canvas>
      <textarea id="inlineTextEditArea" class="inline-text-editor" hidden spellcheck="false"></textarea>
      <div id="photoActionBar" class="photo-action-bar" hidden>
        <button id="photoRotateBtn" class="round-icon-btn" title="90度回転">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 12a9 9 0 1 1-3-6.7L21 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="21 3 21 8 16 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </button>
        <button id="photoDeleteBtn" class="round-icon-btn danger" title="削除">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polyline points="3 6 5 6 21 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </main>

  <!-- 下部ツールバー(常時表示・タブ切替) -->
  <nav class="bottom-tabs">
    <button class="tab-btn active" data-panel="panel-layout">レイアウト</button>
    <button class="tab-btn" data-panel="panel-text">テキスト</button>
  </nav>

  <input type="file" id="fileInput" accept="image/*" multiple hidden>

  <section class="bottom-sheet">

    <div id="panel-layout" class="panel active">
      <div class="field-row">
        <label>枚数</label>
        <div id="countPickerEditor" class="chip-row small"></div>
      </div>
      <div class="field-row">
        <label>比率</label>
        <div id="ratioPickerEditor" class="chip-row small"></div>
      </div>
      <div class="field-row" id="layoutVariantRow" hidden>
        <label>並び</label>
        <div id="layoutVariantPicker" class="variant-row"></div>
      </div>
      <div class="field-row">
        <label>背景</label>
        <div class="bg-swatches">
          <button class="swatch white" data-bg="#FFFFFF" title="白"></button>
          <button class="swatch black" data-bg="#000000" title="黒"></button>
          <input type="color" id="bgColorPicker" value="#ffffff" title="任意カラー">
        </div>
      </div>
      <div class="field-row">
        <label>枠 <span id="spacingVal">8</span>px</label>
        <input type="range" id="spacingSlider" min="0" max="50" value="8">
      </div>
      <div class="field-row">
        <label>角丸 <span id="radiusVal">0</span>px</label>
        <input type="range" id="radiusSlider" min="0" max="100" value="0">
      </div>
    </div>

    <div id="panel-text" class="panel">
      <div class="text-add-row" id="textAddRow">
        <button id="addTextBtnH" class="secondary-btn">＋横書きテキスト追加</button>
        <button id="addTextBtnV" class="secondary-btn">＋縦書きテキスト追加</button>
      </div>

      <div id="textProps" class="props" hidden>
        <div class="field-row">
          <label>フォント</label>
          <select id="textFont">
            <option value="'Hiragino Sans', 'Noto Sans JP', sans-serif">ゴシック</option>
            <option value="'Hiragino Mincho ProN', 'Noto Serif JP', serif">明朝</option>
            <option value="Georgia, serif">Georgia</option>
          </select>
        </div>
        <div class="field-row">
          <label>サイズ <span id="textSizeVal">48</span></label>
          <input type="range" id="textSizeSlider" min="8" max="200" value="48">
        </div>
        <div class="field-row">
          <label>色</label>
          <input type="color" id="textColorPicker" value="#ffffff">
        </div>
        <div class="field-row">
          <label>太さ <span id="textWeightVal">400</span></label>
          <input type="range" id="textWeightSlider" min="100" max="900" step="100" value="400">
        </div>
        <div class="field-row toggles">
          <button id="italicBtn" class="toggle-btn" data-key="italic">I</button>
          <button id="alignLeft" class="toggle-btn" data-align="left">左</button>
          <button id="alignCenter" class="toggle-btn" data-align="center">中</button>
          <button id="alignRight" class="toggle-btn" data-align="right">右</button>
        </div>
        <div class="field-row">
          <label>不透明度 <span id="textOpacityVal">100</span>%</label>
          <input type="range" id="textOpacitySlider" min="0" max="100" value="100">
        </div>
        <div class="field-row">
          <label>行間 <span id="textLineHeightVal">1.2</span></label>
          <input type="range" id="textLineHeightSlider" min="0.8" max="2.5" step="0.05" value="1.2">
        </div>
        <div class="field-row">
          <label>文字間隔 <span id="textLetterSpacingVal">0</span>px</label>
          <input type="range" id="textLetterSpacingSlider" min="-5" max="30" value="0">
        </div>
        <div class="field-row">
          <label>ドロップシャドウ<input type="checkbox" id="shadowToggle"></label>
        </div>
        <div id="shadowProps" hidden>
          <div class="field-row">
            <label>色</label>
            <input type="color" id="shadowColorPicker" value="#000000">
          </div>
          <div class="field-row">
            <label>距離 <span id="shadowDistVal">4</span></label>
            <input type="range" id="shadowDistSlider" min="0" max="60" value="4">
          </div>
          <div class="field-row">
            <label>ぼかし <span id="shadowBlurVal">6</span></label>
            <input type="range" id="shadowBlurSlider" min="0" max="60" value="6">
          </div>
          <div class="field-row">
            <label>角度 <span id="shadowAngleVal">45</span>°</label>
            <input type="range" id="shadowAngleSlider" min="0" max="360" value="45">
          </div>
          <div class="field-row">
            <label>不透明度 <span id="shadowOpacityVal">60</span>%</label>
            <input type="range" id="shadowOpacitySlider" min="0" max="100" value="60">
          </div>
        </div>
        <button id="deleteTextBtn" class="ghost-btn small danger">このテキストを削除</button>
      </div>
    </div>

  </section>
</div>

<!-- ===== テンプレートモーダル ===== -->
<div id="templateModal" class="modal" hidden>
  <div class="modal-card">
    <div class="text-edit-header">
      <h2>テンプレート</h2>
      <button id="templateModalClose" class="icon-btn" title="閉じる">✕</button>
    </div>
    <div id="templateList" class="template-list"></div>
    <div class="field-row">
      <input type="text" id="templateNameInput" placeholder="テンプレート名">
      <button id="saveTemplateBtn" class="secondary-btn">現在の設定を保存</button>
    </div>
    <button id="closeTemplateModal" class="ghost-btn">閉じる</button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
