<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Collage</title>
<!-- Icon shown when added to the iOS home screen. Source PNG has a
     transparent background outside its own rounded card, but iOS renders
     transparency as solid black on home-screen icons - so this is a
     pre-flattened (white background) copy, not the raw upload, to avoid a
     black border around the card. iOS applies its own corner-rounding mask
     on top regardless of the source image's shape. -->
<link rel="apple-touch-icon-precomposed" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Collage">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- Hiragino Mincho ProN only has 2 real weights on iOS (regular/bold), so
     the weight slider had no visible effect beyond those 2 steps. Noto Serif
     JP ships as separate static weight files, giving the slider real steps
     to render. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@200;300;400;500;600;700;800;900&family=Noto+Serif+JP:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== 起動画面(未使用・将来のために保持): 枚数 & キャンバスサイズ選択 ===== -->
<div id="startScreen" class="screen" hidden>
  <div class="start-card">
    <h1>Collage</h1>
    <p class="sub">写真の枚数とキャンバスサイズを選んで開始</p>

    <div class="field">
      <label>写真の枚数</label>
      <div id="countPicker" class="chip-row"></div>
    </div>

    <div class="field">
      <label>キャンバスサイズ</label>
      <div id="ratioPicker" class="chip-row"></div>
    </div>

    <button id="startBtn" class="primary-btn">作成をはじめる</button>
    <button id="resumeBtn" class="ghost-btn" hidden>前回の続きから再開する</button>
  </div>
</div>

<!-- ===== エディタ画面(起動時にそのまま表示) ===== -->
<div id="editorScreen" class="screen">

  <header class="topbar">
    <button id="undoBtn" class="round-icon-btn" title="元に戻す">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M7 8H4V5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4.5 15.5A8 8 0 1 0 6 6.3L4 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button id="redoBtn" class="round-icon-btn" title="やり直す">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M17 8H20V5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M19.5 15.5A8 8 0 1 1 18 6.3L20 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="topbar-spacer"></div>
    <button id="clearAllPhotosBtn" class="round-icon-btn" title="全ての画像を削除">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polyline points="3 6 5 6 21 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M14 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button id="templateBtn" class="text-icon-btn" title="テンプレート">テンプレート</button>
    <button id="exportBtn" class="round-icon-btn primary" title="書き出す">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 15V4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M7.5 8.5L12 4l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M5 14v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </header>

  <main class="editor-main">
    <div class="canvas-wrap">
      <canvas id="mainCanvas"></canvas>
      <textarea id="inlineTextEditArea" class="inline-text-editor" hidden spellcheck="false"></textarea>
      <div id="photoActionBar" class="photo-action-bar" hidden>
        <button id="photoRotateBtn" class="round-icon-btn" title="90度回転">
          <span class="rotate-label">90°</span>
        </button>
        <button id="photoDeleteBtn" class="round-icon-btn danger" title="削除">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polyline points="3 6 5 6 21 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <div id="textActionBar" class="photo-action-bar" hidden>
        <button id="textDuplicateBtn" class="round-icon-btn" title="複製">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="9" y="9" width="12" height="12" rx="2" stroke="currentColor" stroke-width="2"/>
            <path d="M5 15V5a2 2 0 0 1 2-2h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button id="textActionDeleteBtn" class="round-icon-btn danger" title="削除">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polyline points="3 6 5 6 21 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </main>

  <!-- 下部ツールバー(常時表示・アイコンタブ切替)。デフォルトは折り畳み状態
       (アイコン行のみ表示)で、アイコンをタップすると対応するパネルが
       展開する。同じアイコンをもう一度タップすると畳む。 -->
  <nav class="bottom-tabs sheet-collapsed">
    <button class="tab-btn icon-tab active" data-panel="panel-layout" title="レイアウト">
      <svg viewBox="0 0 200 200" class="tab-icon" aria-hidden="true">
        <rect x="12.68" y="12.92" width="173.79" height="173.79" rx="25" ry="25" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="99.58" y1="12.92" x2="99.58" y2="186.71" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="12.68" y1="99.81" x2="186.48" y2="99.81" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="tab-btn icon-tab" data-panel="panel-frame" title="フレーム">
      <svg viewBox="0 0 200 200" class="tab-icon" aria-hidden="true">
        <path d="M18.46,27.22h92.66c35.53,0,64.33,28.8,64.33,64.33v92.66" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

      </svg>
    </button>

      </svg>
    </button>

  <input type="file" id="fileInput" accept="image/*" multiple hidden>

  <section class="bottom-sheet collapsed">

    <div id="panel-layout" class="panel active">
      <div class="field-row">
        <div id="countPickerEditor" class="chip-row small"></div>
      </div>
      <div class="field-row">
        <div id="ratioPickerEditor" class="chip-row small"></div>
      </div>
      <div class="field-row" id="layoutVariantRow" hidden>
        <div id="layoutVariantPicker" class="variant-row"></div>
      </div>
    </div>

    <div id="panel-frame" class="panel">
      <div class="field-row">
        <label>背景</label>
        <div class="bg-swatches">
          <button class="swatch white" data-bg="#FFFFFF" title="白"></button>
          <button class="swatch black" data-bg="#000000" title="黒"></button>
          <input type="color" id="bgColorPicker" value="#ffffff" title="任意カラー">
        </div>
      </div>
      <div class="field-row">
        <label>枠 <span id="spacingVal">8</span>px</label>
        <input type="range" id="spacingSlider" min="0" max="50" value="8">
      </div>
      <div class="field-row">
        <label>角丸 <span id="radiusVal">0</span>px</label>
        <input type="range" id="radiusSlider" min="0" max="100" value="0">
      </div>
    </div>

    <div id="panel-text" class="panel">
      <div class="text-add-row" id="textAddRow">
        <button id="addTextBtnH" class="secondary-btn">＋横書きテキスト追加</button>
        <button id="addTextBtnV" class="secondary-btn">＋縦書きテキスト追加</button>
      </div>

      <div id="textProps" class="props">
        <div class="field-row">
          <label>フォント</label>
          <div class="font-btn-row">
            <button class="toggle-btn font-btn" data-font="'Noto Sans JP', 'Hiragino Sans', sans-serif">ゴシック</button>
            <button class="toggle-btn font-btn" data-font="'Noto Serif JP', 'Hiragino Mincho ProN', serif">明朝</button>
            <input type="color" id="textColorPicker" value="#ffffff">
          </div>
        </div>
        <div class="field-row">
          <label>サイズ <span id="textSizeVal">150</span></label>
          <input type="range" id="textSizeSlider" min="80" max="300" value="150">
        </div>
        <div class="field-row">
          <label>太さ <span id="textWeightVal">400</span></label>
          <input type="range" id="textWeightSlider" min="100" max="900" step="100" value="400">
        </div>
        <div class="field-row toggles">
          <button id="italicBtn" class="toggle-btn italic-label" data-key="italic">斜</button>
          <button id="alignLeft" class="toggle-btn" data-align="left">左</button>
          <button id="alignCenter" class="toggle-btn" data-align="center">中</button>
          <button id="alignRight" class="toggle-btn" data-align="right">右</button>
        </div>
        <div class="field-row">
          <label>文字間隔 <span id="textLetterSpacingVal">0</span>px</label>
          <input type="range" id="textLetterSpacingSlider" min="-5" max="100" value="0">
        </div>
        <div class="field-row">
          <label>行間 <span id="textLineHeightVal">1.2</span></label>
          <input type="range" id="textLineHeightSlider" min="0.8" max="2.5" step="0.05" value="1.2">
        </div>
        <div class="field-row">
          <label>不透明度 <span id="textOpacityVal">100</span>%</label>
          <input type="range" id="textOpacitySlider" min="0" max="100" value="100">
        </div>
      </div>
    </div>

    <div id="panel-shadow" class="panel">
      <div class="text-add-row">
        <label class="secondary-btn shadow-add-btn">＋ドロップシャドウ追加<input type="checkbox" id="shadowToggle"></label>
      </div>
      <div id="shadowProps" hidden>
        <div class="field-row">
          <label>色</label>
          <input type="color" id="shadowColorPicker" value="#000000">
        </div>
        <div class="field-row">
          <label>距離 <span id="shadowDistVal">4</span></label>
          <input type="range" id="shadowDistSlider" min="0" max="60" value="4">
        </div>
        <div class="field-row">
          <label>ぼかし <span id="shadowBlurVal">6</span></label>
          <input type="range" id="shadowBlurSlider" min="0" max="60" value="6">
        </div>
        <div class="field-row">
          <label>角度 <span id="shadowAngleVal">45</span>°</label>
          <input type="range" id="shadowAngleSlider" min="0" max="360" value="45">
        </div>
        <div class="field-row">
          <label>不透明度 <span id="shadowOpacityVal">60</span>%</label>
          <input type="range" id="shadowOpacitySlider" min="0" max="100" value="60">
        </div>
      </div>
    </div>

  </section>
</div>

<!-- ===== テンプレートモーダル ===== -->
<div id="templateModal" class="modal" hidden>
  <div class="modal-card">
    <div class="text-edit-header">
      <h2>テンプレート</h2>
      <button id="templateModalClose" class="icon-btn" title="閉じる">✕</button>
    </div>
    <div id="templateList" class="template-list"></div>
    <div class="field-row">
      <input type="text" id="templateNameInput" placeholder="テンプレート名">
    </div>
    <button id="saveTemplateBtn" class="secondary-btn">設定を保存</button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
